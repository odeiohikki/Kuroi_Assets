name: Importar GIFs RC1
on:
  push:
    branches: [feature/kuroi-2.0]
    paths: ['incoming/Kuroi_upload_*.zip']
permissions:
  contents: write
concurrency:
  group: import-gifs-rc1
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kuroi-2.0
      - run: python3 scripts/import-gifs.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ ! -d gifs ]; then echo 'Aguardando todos os pacotes'; exit 0; fi
          git add -- gifs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Importa GIFs de homologação'
          git push origin HEAD:feature/kuroi-2.0
